<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadastro de Terrapleno</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terrapleno">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0B5A8A">
<style>
/* Cores da ENG Consultoria (azuis do cubo da logo) + marco quilométrico da rodovia */
:root{--placa:#0B5A8A;--placa-esc:#083F61;--amarelo:#2B9FD3;--amarelo-esc:#1E86BF;--asfalto:#2B2F33;--cinza:#5E6B74;--linha:#D2DDE4;--fundo:#EEF3F6;--card:#fff;
 --r0:#2E7D4F;--r1:#B59300;--r2:#D9731A;--r3:#B3261E;
 --sign:"DIN Alternate","DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--asfalto);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:#fff;color:var(--asfalto);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:4px solid var(--amarelo);box-shadow:0 2px 0 var(--placa)}
.logo{height:40px;width:auto;flex:none;display:block}
.hd{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;max-width:720px;margin:0 auto}
header h1{grid-column:1/-1;font:700 20px/1.1 var(--sign);margin:2px 0 0;letter-spacing:.2px;color:var(--placa);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header h1 small{font:500 13px/1.3 system-ui,sans-serif;color:var(--cinza)}
.logo-txt{font:700 18px/1 var(--sign);color:var(--placa)}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:#EAF4FA;color:var(--placa);white-space:nowrap}
.pill.ok{background:var(--placa);color:#fff}.pill.warn{background:#FFF1C2;color:#7A5A00}
main{max-width:720px;margin:0 auto;padding:16px 14px 128px}
.btn{appearance:none;border:2px solid var(--asfalto);background:#fff;color:var(--asfalto);font:inherit;font-weight:650;min-height:48px;padding:10px 16px;border-radius:12px;cursor:pointer;touch-action:manipulation}
.btn.pri{background:var(--amarelo);border-color:var(--amarelo);color:#fff}
.btn.pri:active{background:var(--amarelo-esc)}
.btn.ghost{border-color:var(--linha);background:transparent}
.btn.danger{border-color:transparent;background:transparent;color:var(--r3)}
.btn:disabled{opacity:.45}
.btn:focus-visible,.chip:focus-visible,.frase:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--placa);outline-offset:2px}
.big{width:100%;font-size:18px;min-height:58px}
.note{font-size:14px;color:var(--cinza);margin:6px 2px 16px;max-width:60ch}
/* lista */
.new{display:flex;align-items:center;justify-content:center;gap:10px;font:700 21px/1 var(--sign);letter-spacing:.3px}
.new svg{flex:none}
.rec{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px;border:1px solid var(--linha)}
.marco{grid-row:1/3;align-self:start;width:84px;background:#fff;border:3px solid var(--asfalto);border-radius:10px;text-align:center;padding:6px 4px 7px;position:relative}
.marco:after{content:"";position:absolute;left:50%;bottom:-10px;width:8px;height:8px;margin-left:-4px;background:var(--asfalto);border-radius:0 0 3px 3px}
.marco b{display:block;font:700 12px/1 var(--sign);letter-spacing:1px;color:var(--cinza)}
.marco span{display:block;font:700 22px/1.05 var(--sign);margin-top:3px}
.marco i{display:block;font:700 15px/1 var(--sign);font-style:normal;color:var(--cinza)}
.rec h3{margin:2px 0 0;font:700 19px/1.2 var(--sign)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fundo);color:var(--asfalto)}
.tag.r0{background:var(--r0);color:#fff}.tag.r1{background:var(--r1);color:#fff}.tag.r2{background:var(--r2);color:#fff}.tag.r3{background:var(--r3);color:#fff}
.tag.sync{background:transparent;color:var(--cinza);padding-left:0}
.thumb{grid-column:1/-1;display:flex;gap:6px;margin-top:8px}
.thumb img{width:64px;height:48px;object-fit:cover;border-radius:6px}
.rec .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rec .acts .btn{flex:1;min-width:110px;min-height:44px;font-size:15px}
.empty{text-align:center;color:var(--cinza);padding:30px 12px 10px}
.empty svg{display:block;margin:0 auto 12px}
.export{margin-top:22px;padding-top:18px;border-top:2px dashed var(--linha)}
/* formulário */
.nav{position:sticky;top:var(--hh,64px);z-index:4;background:var(--fundo);margin:-16px -14px 12px;padding:10px 14px 8px;border-bottom:1px solid var(--linha)}
.navs{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:2px}
.navs::-webkit-scrollbar{display:none}
.navs button{flex:none;scroll-snap-align:start;appearance:none;border:1.5px solid var(--linha);background:#fff;color:var(--asfalto);font:600 14px/1 system-ui,sans-serif;padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.navs button.done{background:var(--placa);border-color:var(--placa);color:#fff}
.navs button.done:before{content:"✓ "}
.prog{height:5px;background:var(--linha);border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--amarelo);width:0;transition:width .25s}
section.sec{background:var(--card);border:1px solid var(--linha);border-radius:14px;margin:0 0 14px;overflow:hidden;scroll-margin-top:calc(var(--hh,64px) + 74px)}
section.sec>h2{margin:0;font:700 18px/1.2 var(--sign);padding:12px 14px;border-left:6px solid var(--placa);display:flex;justify-content:space-between;align-items:center;gap:8px}
section.sec>h2 span{font:600 13px/1 system-ui,sans-serif;color:var(--cinza)}
section.sec.ok>h2 span{color:var(--placa)}
.fields{padding:2px 14px 14px}
.f{margin-top:14px}
.f>label,.f>.lb,.lb{display:block;font-size:15px;font-weight:650;color:var(--asfalto);margin-bottom:7px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>.f{min-width:0}
input[type=text],input[type=date],textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--linha);border-radius:10px;background:#fff;color:var(--asfalto)}
input:focus,textarea:focus{outline:none;border-color:var(--placa)}
input::placeholder,textarea::placeholder{color:#9AA39C}
textarea{min-height:120px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:inherit;font-size:16px;min-height:46px;padding:9px 15px;border-radius:999px;border:2px solid var(--linha);background:#fff;color:var(--asfalto);cursor:pointer;touch-action:manipulation}
.chip[aria-pressed=true]{background:var(--amarelo);border-color:var(--placa);color:#fff;font-weight:700}
.chip[aria-pressed=true]:before{content:"✓ "}
.hint{font-size:14px;color:var(--cinza);margin-top:7px}
input[type=text]:not([inputmode=decimal]),textarea{text-transform:none}
.utm{font:700 15px/1.3 var(--sign);color:var(--placa);margin-top:8px}
.gps{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--placa)!important;border-color:var(--placa)!important;color:#fff!important}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{position:relative;aspect-ratio:4/3;border:2px dashed #AEB8B0;border-radius:12px;background:#F6F8F5;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--cinza);font-weight:650;text-align:center;padding:6px}
.ph.croq{grid-column:1/-1;aspect-ratio:2/1}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph .x{position:absolute;top:6px;right:6px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(35,39,43,.8);color:#fff;font-size:20px;line-height:36px;padding:0;cursor:pointer}
.ph .n{position:absolute;left:6px;bottom:6px;z-index:2;background:rgba(35,39,43,.8);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px}
.frases{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.frase{appearance:none;text-align:left;font:inherit;font-size:15px;padding:10px 12px 10px 34px;border:1.5px solid var(--linha);border-radius:10px;background:#F6F8F5;color:var(--asfalto);cursor:pointer;position:relative}
.frase:before{content:"+";position:absolute;left:12px;top:9px;font-weight:700;color:var(--placa)}
.frase:active{background:#E3E8E1}
/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--placa-esc);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bar .btn{flex:1;max-width:340px}
.bar .btn:not(.pri){background:transparent;color:#fff;border-color:#4B7393}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--asfalto);color:#fff;padding:11px 16px;border-radius:10px;font-size:15px;z-index:20;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;border-left:5px solid var(--amarelo)}
.toast.on{opacity:1}
.dlg{position:fixed;inset:0;background:rgba(20,24,22,.55);z-index:30;display:none;align-items:flex-end;justify-content:center;padding:16px}
.dlg.on{display:flex}
.dlg .box{background:#fff;border-radius:18px;padding:18px;max-width:440px;width:100%;margin-bottom:env(safe-area-inset-bottom)}
.dlg .box p{margin:0 0 14px;font-size:17px}
.dlg .box .acts{display:flex;gap:10px}.dlg .box .acts .btn{flex:1}
#chooser .box p{font:700 22px/1.1 var(--sign)}
#chooser .btn{text-align:left;padding:12px 16px}
#chooser small{display:block;font-size:14px;font-weight:400;opacity:.8;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hidden{display:none!important}
</style>
</head>
<body>
<header id="hdr"><div class="hd"><img class="logo" alt="ENG Consultoria" onerror="this.outerHTML='<span class=logo-txt>ENG Consultoria</span>'" src="https://static.wixstatic.com/media/bd40cc_257e0fc23f794f808a9e45057b28eb8c~mv2.png/v1/fill/w_240,h_72,al_c,q_90/logo.png"><span id="st" class="pill">Carregando…</span><h1>Terraplenos<small id="sub">Pronto para o campo</small></h1></div></header>
<main>
  <div id="vList">
    <button class="btn pri big new" id="bNew"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3v16M3 11h16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>Novo cadastro</button>
    <p class="note" id="note">Tudo fica salvo no celular enquanto você preenche, mesmo sem sinal.</p>
    <div id="list"></div>
    <div class="export">
    <button class="btn big hidden" id="bAll" style="border-color:var(--placa);background:var(--placa);color:#fff">Baixar Linear + fotos (.zip)</button>
    <p class="note" id="allNote">O Linear vem com as macros e os cadastros na aba “Linear Gerar Fichas”, junto das pastas Fotos e Croquis.</p>
    <button class="btn ghost big hidden" id="bFichas">Baixar só as fichas (.zip)</button></div>
    <p class="note" id="ver" style="text-align:center;margin-top:24px"></p>
  </div>
  <div id="vForm" class="hidden"><div id="form"></div></div>
</main>
<div class="bar hidden" id="bar"><button class="btn" id="bBack">‹ Lista</button><button class="btn pri" id="bXls">Baixar ficha</button></div>
<div class="toast" id="toast"></div>
<div class="dlg" id="chooser"><div class="box"><p>Qual o próximo talude?</p>
 <button class="btn pri big" id="chNext" style="margin-bottom:10px">Próximo talude<small>Repete rodovia, sentido, vegetação e drenagem do último</small></button>
 <button class="btn big" id="chOther" style="margin-bottom:10px">Mesmo km, outro sentido<small>Copia tudo do último e troca o sentido</small></button>
 <button class="btn big" id="chBlank" style="margin-bottom:10px">Em branco<small>Só com o mais comum já marcado</small></button>
 <button class="btn ghost big" id="chCancel">Cancelar</button></div></div>
<div class="dlg" id="dlg"><div class="box"><p id="dlgMsg"></p><div class="acts"><button class="btn ghost" id="dlgNo">Cancelar</button><button class="btn danger" id="dlgYes">Excluir</button></div></div></div>

<script>// Núcleo: preenche o modelo Terrapleno (xlsx) e gera o arquivo, sem bibliotecas.
var CORE = (function () {
  var enc = new TextEncoder(), dec = new TextDecoder();
  function b64ToBytes(b) {
    if (typeof atob === 'function') { var s = atob(b), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
    return new Uint8Array(Buffer.from(b, 'base64'));
  }
  // ---- CRC32 + ZIP (store) ----
  var CRC = (function () { var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u) { var c = 0xFFFFFFFF; for (var i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(entries) { // entries: [{name, data:Uint8Array}]
    var parts = [], central = [], offset = 0;
    entries.forEach(function (e) {
      var nm = enc.encode(e.name), d = e.data, crc = crc32(d);
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true);
      h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), nm, d);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true);
      c.setUint16(28, nm.length, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), nm);
      offset += 30 + nm.length + d.length;
    });
    var csize = central.reduce(function (a, b) { return a + b.length; }, 0);
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, csize, true); end.setUint32(16, offset, true);
    var all = parts.concat(central, [new Uint8Array(end.buffer)]);
    var total = all.reduce(function (a, b) { return a + b.length; }, 0), out = new Uint8Array(total), p = 0;
    all.forEach(function (b) { out.set(b, p); p += b.length; });
    return out;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ''); }
  // Escreve um valor numa célula existente do XML da planilha, mantendo o estilo.
  function setCell(xml, ref, val, kind) {
    var re = new RegExp('<c r="' + ref + '"([^>]*?)(/>|>[\\s\\S]*?</c>)');
    var m = xml.match(re);
    if (!m) throw new Error('Célula ' + ref + ' não encontrada no modelo');
    var attrs = m[1].replace(/\s+t="[^"]*"/, '');
    var cell;
    if (kind === 'num') cell = '<c r="' + ref + '"' + attrs + '><v>' + val + '</v></c>';
    else cell = '<c r="' + ref + '"' + attrs + ' t="inlineStr"><is><t xml:space="preserve">' + esc(val) + '</t></is></c>';
    return xml.replace(m[0], cell);
  }
  function toNum(v) { if (v === '' || v == null) return null; var n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
  function dateSerial(iso) { var p = String(iso).split('-'); if (p.length !== 3) return null; return (Date.UTC(+p[0], +p[1] - 1, +p[2]) - Date.UTC(1899, 11, 30)) / 86400000; }

  // Mapa campo -> célula do modelo
  var MAP = [
    ['ident', 'B5'], ['local', 'D5'], ['rodovia', 'F5'], ['tipo', 'B6'], ['data', 'F6', 'date'],
    ['kmIni', 'B8'], ['kmFim', 'B9'], ['sentido', 'D8'], ['lat', 'F8'], ['lon', 'F9'],
    ['ext', 'B11', 'num'], ['alt', 'D11', 'num'], ['incl', 'F11', 'num'], ['distAcost', 'B12', 'num'],
    ['tipoTerr', 'B14'], ['relevo', 'F14'], ['veg', 'B15'], ['dens', 'F15'],
    ['tipoCont', 'B17'], ['contExt', 'B18', 'num'], ['contAlt', 'B19', 'num'], ['ancor', 'B20'], ['elem', 'B21'],
    ['drenSup', 'B23'], ['drenSupCond', 'E23'], ['drenSub', 'B24'], ['drenSubCond', 'F24'],
    ['agua', 'B26'], ['ocorr', 'B28'], ['causas', 'B30'], ['passivo', 'B31'], ['risco', 'E33'], ['riscoOutros', 'E34'],
    ['obs', 'A36'], ['drenSubTipo', 'D24']
  ];
  // Caixas das fotos na aba Terrapleno_2 (col, linha 0-based, largura/altura em px)
  var BOX = [[0, 5, 303, 252], [1, 5, 303, 252], [0, 18, 303, 252], [1, 18, 303, 252], [0, 31, 606, 304]], PAD = 5, EMU = 9525;

  // rec: {f:{...campos}, photos:[{bytes:Uint8Array, w, h}|null x4]}
  function build(tplFiles, rec) {
    var files = {};
    Object.keys(tplFiles).forEach(function (k) { files[k] = b64ToBytes(tplFiles[k]); });
    var s1 = dec.decode(files['xl/worksheets/sheet1.xml']);
    var f = norm(rec.f || {});
    MAP.forEach(function (m) {
      var v = f[m[0]]; if (v == null || v === '') return;
      if (m[2] === 'num') { var n = toNum(v); s1 = n == null ? setCell(s1, m[1], v) : setCell(s1, m[1], n, 'num'); }
      else if (m[2] === 'date') { var d = dateSerial(v); if (d != null) s1 = setCell(s1, m[1], d, 'num'); }
      else s1 = setCell(s1, m[1], v);
    });
    files['xl/worksheets/sheet1.xml'] = enc.encode(s1);


    var photos = (rec.photos || []).slice(0, 5), anchors = '', rels = '', id = 100;
    photos.forEach(function (ph, i) {
      if (!ph || !ph.bytes) return;
      var name = 'foto' + (i + 1) + '.jpeg', rid = 'rIdFoto' + (i + 1);
      files['xl/media/' + name] = ph.bytes;
      rels += '<Relationship Id="' + rid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/' + name + '"/>';
      var b = BOX[i], BW = b[2], BH = b[3];
      var sc = Math.min((BW - 2 * PAD) / ph.w, (BH - 2 * PAD) / ph.h);
      var w = Math.round(ph.w * sc), h = Math.round(ph.h * sc);
      var ox = Math.round((BW - w) / 2), oy = Math.round((BH - h) / 2);
      anchors += '<xdr:oneCellAnchor><xdr:from><xdr:col>' + b[0] + '</xdr:col><xdr:colOff>' + ox * EMU + '</xdr:colOff><xdr:row>' + b[1] + '</xdr:row><xdr:rowOff>' + oy * EMU + '</xdr:rowOff></xdr:from>' +
        '<xdr:ext cx="' + w * EMU + '" cy="' + h * EMU + '"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="' + (id++) + '" name="Foto ' + (i + 1) + '"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>' +
        '<xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>' +
        '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + w * EMU + '" cy="' + h * EMU + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>';
    });
    if (anchors) {
      var d2 = dec.decode(files['xl/drawings/drawing2.xml']).replace('</xdr:wsDr>', anchors + '</xdr:wsDr>');
      files['xl/drawings/drawing2.xml'] = enc.encode(d2);
      var r2 = dec.decode(files['xl/drawings/_rels/drawing2.xml.rels']).replace('</Relationships>', rels + '</Relationships>');
      files['xl/drawings/_rels/drawing2.xml.rels'] = enc.encode(r2);
    }

 q.onsuccess=function(){res((q.result||[]).map(function(r){r.photos=(r.photos||[]).concat([null,null,null,null,null]).slice(0,5).map(function(p){if(!p)return null;if(p.buf){p.blob=new Blob([p.buf],{type:'image/jpeg'});delete p.buf}return p});return r}))};q.onerror=function(){res(Object.values(MEM))}}catch(e){res(Object.values(MEM))}})}

 var copy=Object.assign({},r);delete copy._coordInputs;
 copy.photos=await Promise.all((r.photos||[]).map(async function(p){if(!p)return null;var o={w:p.w,h:p.h,assetId:p.assetId||null};if(p.blob){if(!p._buf)p._buf=await p.blob.arrayBuffer();o.buf=p._buf}return o}));
